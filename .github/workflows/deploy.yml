name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Baixa fotos licenciadas (Wikimedia Commons) e coordenadas verificadas.
      # Pulado quando as fotos já foram versionadas (enrichment.json com data).
      # Se a consulta falhar, o site continua com placeholders elegantes.
      - name: Enriquecer fotos e coordenadas
        run: |
          if grep -q '"generatedAt": null' src/data/generated/enrichment.json; then
            npm run enrich || echo "Enriquecimento falhou; seguindo com placeholders."
          else
            echo "Fotos já versionadas; pulando."
          fi

      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
